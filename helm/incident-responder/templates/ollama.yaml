{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-ollama
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.storageSize | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ollama
spec:
  selector:
    app: {{ .Release.Name }}-ollama
  ports:
    - port: 11434
      targetPort: 11434
---
# Ollama has no authentication: allow only the responder. This is enforced only
# when the cluster's CNI has network policy support enabled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ollama
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-ollama
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-incident-responder
      ports:
        - port: 11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ollama
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-ollama
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Download the model once; later restarts reuse the volume.
        - name: pull-model
          image: {{ .Values.ollama.image | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ollama serve &
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama show "$MODEL" >/dev/null 2>&1 || ollama pull "$MODEL"
          env:
            - name: MODEL
              value: {{ .Values.vllmModel | quote }}
            - name: HOME
              value: /models
            - name: OLLAMA_MODELS
              value: /models
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: ollama
          image: {{ .Values.ollama.image | quote }}
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: HOME
              value: /models
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_CONTEXT_LENGTH
              value: {{ .Values.ollama.contextLength | quote }}
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-ollama
{{- end }}
