groups:
  - name: kubernetes-incidents
    rules:
      - alert: KubePodCrashLooping
        expr: max by (namespace, pod) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping'
      - alert: KubePodFailed
        expr: max by (namespace, pod) (kube_pod_status_phase{phase="Failed"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} has failed'
      - alert: KubePodHighCPU
        expr: sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} exceeds 1 CPU core'
      - alert: KubePodHighMemory
        expr: sum by (namespace, pod) (container_memory_working_set_bytes{container!="",container!="POD"}) > 1073741824
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} exceeds 1 GiB memory'
